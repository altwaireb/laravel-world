name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    strategy:
      fail-fast: true
      matrix:
        include:
          # Laravel 13 - supported PHP range
          - os: ubuntu-latest
            php: 8.5
            laravel: ^13.23.0
            testbench: 11.*
            pest: ^4.4.1
            pest_plugin: ^4.1
            stability: prefer-stable

          - os: ubuntu-latest
            php: 8.3
            laravel: ^13.23.0
            testbench: 11.*
            pest: ^4.4.1
            pest_plugin: ^4.1
            stability: prefer-stable

          - os: ubuntu-latest
            php: 8.3
            laravel: ^13.23.0
            testbench: 11.*
            pest: ^4.4.1
            pest_plugin: ^4.1
            stability: prefer-lowest

          # Laravel 12
          - os: ubuntu-latest
            php: 8.3
            laravel: 12.*
            testbench: 10.*
            pest: ^3.8.2
            pest_plugin: ^3.2
            stability: prefer-stable

          # Laravel 11
          - os: ubuntu-latest
            php: 8.3
            laravel: 11.*
            testbench: 9.*
            pest: ^3.8.2
            pest_plugin: ^3.2
            stability: prefer-stable

          - os: ubuntu-latest
            php: 8.2
            laravel: 11.*
            testbench: 9.*
            pest: ^3.8.2
            pest_plugin: ^3.2
            stability: prefer-lowest

          # Laravel 10
          - os: ubuntu-latest
            php: 8.3
            laravel: 10.*
            testbench: 8.*
            pest: ^2.34.7
            pest_plugin: ^2.4
            stability: prefer-stable

          - os: ubuntu-latest
            php: 8.2
            laravel: 10.*
            testbench: 8.*
            pest: ^2.34.7
            pest_plugin: ^2.4
            stability: prefer-lowest

          # Windows compatibility
          - os: windows-latest
            php: 8.3
            laravel: ^13.23.0
            testbench: 11.*
            pest: ^4.4.1
            pest_plugin: ^4.1
            stability: prefer-stable

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest_plugin }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci
